<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>わが家のレシピ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="レシピ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbf6ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1a16" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#fbf6ee;--card:#fffdf9;--ink:#2b2520;--sub:#6f655a;--line:#e6dccd;
  --accent:#b8501c;--accent-ink:#fff;--soft:#f5e7d8;--ok:#2f7a4a;--ok-soft:#e1f1e6;--warn:#8a5a00;--warn-soft:#fbf0d3;
  --shadow:0 1px 3px rgba(60,40,20,.12);
  --sans:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo UI",sans-serif;
  --mincho:"Hiragino Mincho ProN","Noto Serif JP","Yu Mincho",serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1d1a16;--card:#27231e;--ink:#f1eae0;--sub:#b3a898;--line:#3d372f;--accent:#e98a54;--accent-ink:#231305;--soft:#3a2c20;--ok:#7fd19c;--ok-soft:#1f3527;--warn:#e8c26e;--warn-soft:#3a2f17;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
#app{max-width:680px;margin:0 auto;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.top{display:flex;align-items:center;gap:8px;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
.top h1{font-family:var(--mincho);font-size:22px;margin:0;flex:1;min-width:0;letter-spacing:.04em}
.iconbtn{min-width:44px;height:44px;border:0;background:transparent;border-radius:10px;font-size:15px;padding:0 8px;color:var(--ink)}
.iconbtn:active{background:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:#c0392b;border-color:#c0392b;background:transparent}
.btn.wide{width:100%}
.wrap{padding:0 16px 24px}
.search{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:transparent;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);text-decoration:none;color:inherit}
.item b{display:block;font-family:var(--mincho);font-size:18px;line-height:1.4}
.item small{display:block;color:var(--sub);font-size:13px;margin-top:4px}
.empty{text-align:center;color:var(--sub);padding:48px 16px}
.empty h2{font-family:var(--mincho);color:var(--ink);font-size:20px;margin:0 0 8px}
.fab{position:fixed;right:max(16px,calc(50vw - 324px));bottom:calc(20px + env(safe-area-inset-bottom));height:56px;padding:0 22px;border-radius:28px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
.title{font-family:var(--mincho);font-size:25px;line-height:1.35;margin:4px 0}
.meta{color:var(--sub);font-size:14px}
h2.sec{font-size:15px;color:var(--accent);margin:24px 0 8px;letter-spacing:.08em}
.ing{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ing li{border-top:1px solid var(--line)}
.ing li:first-child{border-top:0}
.ing label{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 14px}
.ing input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.ing input:checked+span{color:var(--sub);text-decoration:line-through}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:17px;line-height:1.75}
.steps li:first-child{border-top:0}
.steps .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;margin-top:2px}
.steps .h{font-weight:700;color:var(--sub);font-size:15px}
.memo{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
/* 目印（☆・Aなど） */
.mk{display:inline-flex;align-items:center;justify-content:center;min-width:1.5em;height:1.5em;padding:0 .35em;margin:0 .15em;border-radius:.4em;background:var(--soft);color:var(--accent);font-weight:700;font-size:.9em;line-height:1;white-space:nowrap}
.ing .mk{margin:0 .45em 0 0}
.ing li.ing-group{display:flex;align-items:center;min-height:40px;padding:6px 14px;background:var(--soft);font-weight:700;font-size:14px}
.ing li.ing-group .mk{background:var(--card)}
.ing li.in-group label{padding-left:26px}
.st-body{flex:1;min-width:0}
.refs{margin-top:8px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:15px;line-height:1.6}
.ref{display:flex;gap:8px;align-items:flex-start}
.ref+.ref{margin-top:6px}
.ref.named{display:block}
.ref .mk{margin:.1em 0 0;flex:none}
.ref-list{min-width:0}
.cook .refs{font-size:calc(18px * var(--scale,1));margin-top:14px}
/* 分量の変更 */
.ing-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:24px 0 8px}
.ing-top h2.sec{margin:0}
.serv{display:flex;align-items:center;gap:4px}
.serv button{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--card);font-size:20px;line-height:1}
.serv button:active{background:var(--soft)}
.serv button:disabled{opacity:.4}
.serv b{min-width:4.6em;text-align:center}
.serv-note{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:13px;line-height:1.5;margin:0 0 10px}
.serv-note span{flex:1;min-width:0}
b.amt{color:var(--accent)}
.bottombar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 24%);padding:20px 16px calc(14px + env(safe-area-inset-bottom));display:flex}
.wake{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:600;white-space:nowrap;color:var(--sub)}
.wake::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--sub)}
.wake.on{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.wake.on::before{background:var(--ok)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
label.f{display:block;margin-top:16px;font-weight:600;font-size:14px}
label.f small{font-weight:400;color:var(--sub)}
label.f input,label.f textarea{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 12px;font-weight:400;font-size:16px}
label.f input{height:46px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:20px}
.row>*{flex:1}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw}
/* 調理モード */
.cook{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.cook-top{display:flex;align-items:center;gap:6px;padding:8px 10px}
.cook-top .spacer{flex:1}
.cook-main{flex:1;overflow:auto;padding:8px 22px 16px;max-width:680px;width:100%;margin:0 auto}
.cook-count{color:var(--accent);font-weight:700;font-size:16px;letter-spacing:.04em}
.cook-sec{color:var(--sub);font-size:15px;margin-top:2px}
.cook-text{font-size:calc(26px * var(--scale,1));line-height:1.7;margin-top:10px;font-weight:500}
.cook-bar{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;padding:10px 12px 14px;max-width:680px;width:100%;margin:0 auto}
.cook-bar .btn{min-height:76px;font-size:20px}
.cook-ing-btn{margin:0 12px;max-width:656px;align-self:center;width:calc(100% - 24px);min-height:46px}
.progress{height:4px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.3);padding:6px 16px calc(16px + env(safe-area-inset-bottom));z-index:2}
.sheet-head{display:flex;align-items:center;position:sticky;top:0;background:var(--card);padding:8px 0}
.sheet-head b{flex:1;font-size:17px}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ---------- 保存（端末の中だけ） ---------- */
var KEY='recipes.v1',PREF='recipes.prefs.v1';
var mem=null;
function load(){
  if(mem)return mem;
  try{mem=JSON.parse(localStorage.getItem(KEY))||[];}catch(e){mem=[];}
  return mem;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(mem));return true;}
  catch(e){toast('保存できませんでした。バックアップを書き出してください');return false;}
}
function prefs(){try{return JSON.parse(localStorage.getItem(PREF))||{};}catch(e){return {};}}
function setPref(k,v){var p=prefs();p[k]=v;try{localStorage.setItem(PREF,JSON.stringify(p));}catch(e){}}
function getRecipe(id){return load().find(function(r){return r.id===id;});}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){});}

/* ---------- 貼り付け文字の読み取り（レシピ抜き出しボタンの形式が基本） ---------- */
function parseRecipe(text){
  var r={title:'',servings:'',ingredients:[],steps:[],url:'',memo:''};
  var mode='head',head=[];
  String(text||'').replace(/\r\n?/g,'\n').split('\n').forEach(function(raw){
    var l=raw.replace(/[\s　]+$/,'').replace(/^[\s　]+/,'');
    if(!l)return;
    var src=/^(?:出典|URL|url|引用元)[：:]?\s*(https?:\/\/\S+)/.exec(l);
    if(src){r.url=src[1];return;}
    if(/^https?:\/\/\S+$/.test(l)){if(!r.url)r.url=l;return;}
    var bare=l.replace(/^[■□●○◆◇▼▽★☆【\[〈《]\s*/,'').replace(/\s*[】\]〉》：:]\s*$/,'');
    if(/^(.{0,30}の)?(材料|食材|ingredients?)(\s*[（(].*[)）])?$/i.test(bare)){
      var y=/[（(](.*)[)）]/.exec(bare);if(y&&!r.servings)r.servings=y[1];
      mode='ing';return;
    }
    if(/^(.{0,30}の)?(作り方|つくり方|作りかた|手順|工程|directions?|instructions?)$/i.test(bare)){mode='step';return;}
    if(/^(メモ|ポイント|コツ)$/.test(bare)){mode='memo';return;}
    if(mode==='head'){head.push(l);}
    /* ●は目印のこともあるので残す。全行についているだけなら表示のときに無視する */
    else if(mode==='ing'){var i=l.replace(/^[・･\-*•]\s*/,'');if(i)r.ingredients.push(i);}
    else if(mode==='step'){
      var s=/^〈.*〉$/.test(l)?l:l.replace(/^(?:step\s*)?[0-9０-９]+\s*[.．、:：)）]\s*/i,'').replace(/^[（(][0-9０-９]+[)）]\s*/,'').replace(/^[①-⑳]\s*/,'');
      if(s)r.steps.push(s);
    }
    else r.memo+=(r.memo?'\n':'')+l;
  });
  if(head.length){
    var m=/^(.*?)[（(]([^（）()]*)[)）]$/.exec(head[0]);
    if(m&&m[1]){r.title=m[1].trim();if(!r.servings)r.servings=m[2];}
    else r.title=head[0];
    /* 見出しが何もない文章は、残りを作り方として受ける */
    if(mode==='head')r.steps=head.slice(1);
  }
  return r;
}

/* ---------- 画面ONの維持 ---------- */
var Wake={sentinel:null,want:false,failed:false,
  supported:function(){return 'wakeLock' in navigator;},
  isOn:function(){return !!this.sentinel;},
  request:function(fromTap){
    var self=this;
    if(!this.supported()||this.sentinel)return Promise.resolve();
    return navigator.wakeLock.request('screen').then(function(s){
      self.sentinel=s;self.failed=false;
      s.addEventListener('release',function(){self.sentinel=null;paintWake();});
      if(!self.want)self.stop();
      paintWake();
    }).catch(function(){
      /* タップ前は断られることがある端末もあるので、タップで取り直しても駄目なときだけ警告する */
      if(fromTap)self.failed=true;
      paintWake();
    });
  },
  start:function(){this.want=true;this.request();},
  stop:function(){this.want=false;if(this.sentinel){this.sentinel.release().catch(function(){});this.sentinel=null;}paintWake();}
};
/* 別アプリから戻ると解除されているので取り直す。拒否された端末は次のタップで再挑戦 */
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&Wake.want)Wake.request();});
document.addEventListener('pointerup',function(){if(Wake.want&&!Wake.sentinel)Wake.request(true);});
function wakeWanted(){return prefs().wake!==false;}
function wakeHtml(){return '<button class="wake" data-act="wake" aria-live="polite"></button>';}
function paintWake(){
  [].forEach.call(document.querySelectorAll('.wake'),function(b){
    var on=Wake.isOn();
    b.classList.toggle('on',on);
    b.textContent=on?'画面ON キープ中':(!Wake.supported()?'画面ON 非対応':(Wake.want?'画面ON タップで開始':'画面ON 切'));
  });
  var n=document.getElementById('wake-note');
  if(n)n.hidden=!(Wake.want&&(!Wake.supported()||(Wake.failed&&!Wake.isOn())));
}
var WAKE_NOTE='<div id="wake-note" class="notice" hidden>この環境では画面をつけたままにできません。アプリをhttpsのページで開いているか、OSを新しくできるか確認してください。それまでは端末の自動ロックの時間を長くしてください。</div>';

/* ---------- 小道具 ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(s){return document.querySelector(s);}
var toastTimer;
function toast(msg){
  var old=$('.toast');if(old)old.remove();
  var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.remove();},2600);
}
function isSection(s){return /^〈.*〉$/.test(s);}
function realSteps(r){
  /* 調理モード用：区切り見出しは次の工程のラベルにする */
  var out=[],sec='';
  r.steps.forEach(function(s){if(isSection(s))sec=s.slice(1,-1);else{out.push({text:s,sec:sec});sec='';}});
  return out;
}
/* ---------- 目印（☆・Aなど）の読み取り。保存した文字は変えず、表示のたびに読む ---------- */
var MARK_SYM='⭐|🌟|☆|★|✩|✪|✫|✭|✮|✯|◎|○|◯|●|◉|◇|◆|□|■|△|▲|▽|▼|♪|♫|♡|♥|❤|♦|♠|♣|＊|Ⓐ|Ⓑ|Ⓒ|Ⓓ|Ⓔ|Ⓕ';
var VS='[\\uFE0E\\uFE0F]?',LATIN='A-Za-zＡ-Ｚａ-ｚ0-9０-９';
var RE_MK_BOX=new RegExp('^[(（\\[［【〈《<＜]\\s*([A-FＡ-Ｆ]|'+MARK_SYM+')'+VS+'\\s*[)）\\]］】〉》>＞][\\s:：・]*(.*)$');
var RE_MK_SYM=new RegExp('^('+MARK_SYM+')'+VS+'[\\s:：・]*(.*)$');
var RE_MK_LET=new RegExp('^([A-FＡ-Ｆ])(?![.．'+LATIN+'])[\\s:：・]*(.*)$');
var RE_GROUP=/^[【〈《<＜\[［]\s*(.+?)\s*[】〉》>＞\]］]$/;
var RE_GROUP_WORD=/^(合わせ.*|.*調味料|(つけ|かけ|ごま)?(たれ|だれ|タレ|ダレ)|ソース|ドレッシング)$/;
var RE_HAS_AMT=/[0-9０-９½¼¾⅓⅔]|少々|適量|少し|お好み|ひとつまみ/;
function markKey(s){
  return s.replace(/[︎️]/g,'').replace(/[Ａ-Ｆ]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);});
}
/* 材料1行を {head:見出し行か, mark:目印, text:残りの文字} にする */
function readIng(l){
  var m=RE_MK_BOX.exec(l)||RE_MK_SYM.exec(l)||RE_MK_LET.exec(l);
  if(m){
    var mk=markKey(m[1]),rest=m[2].replace(/^[（(]\s*(.*?)\s*[)）]$/,'$1');
    if(!rest)return {head:true,mark:mk,text:''};
    if(!RE_HAS_AMT.test(rest)){
      /* ■たれ のような見出しの書き方 */
      if(/^[■□▼▽]$/.test(mk)){
        var inner=readIng(rest);
        return inner.mark?{head:true,mark:inner.mark,text:inner.text}:{head:true,mark:'',text:rest};
      }
      if(RE_GROUP_WORD.test(rest))return {head:true,mark:mk,text:rest};
    }
    return {head:false,mark:mk,text:m[2]};
  }
  m=RE_GROUP.exec(l);
  if(m){
    var g=readIng(m[1]);
    return g.mark?{head:true,mark:g.mark,text:g.text}:{head:true,mark:'',text:m[1]};
  }
  return {head:false,mark:'',text:l};
}
function groupName(s){return s.replace(/(の材料|の調味料|用)$/,'');}
function reEscape(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function markRe(words){
  if(!words.length)return null;
  var alts=words.slice().sort(function(a,b){return b.length-a.length;}).map(function(w){
    if(/^[A-F]$/.test(w))return w+'|'+String.fromCharCode(w.charCodeAt(0)+0xFEE0);
    return reEscape(w)+(w.length===1?VS:'');
  });
  return new RegExp('(^|[^'+LATIN+'])('+alts.join('|')+')(?!['+LATIN+'])','g');
}
function ingInfo(r){
  var steps=(r.steps||[]).join('\n'),cur='',heads={},count={},plain=0;
  var rows=(r.ingredients||[]).map(function(l,i){
    var x=readIng(l);x.i=i;x.raw=l;
    if(x.head){cur=x.mark||groupName(x.text);heads[cur]=1;}
    else{x.group=cur;plain++;if(x.mark)count[x.mark]=(count[x.mark]||0)+1;}
    return x;
  });
  /* 全行が同じ印（ただの箇条書き）や、手順に出てこない1行だけの印は目印として扱わない */
  rows.forEach(function(x){
    if(x.head||!x.mark||heads[x.mark])return;
    var n=count[x.mark];
    if((n===1||n===plain)&&steps.search(markRe([x.mark]))<0){x.mark='';x.text=x.raw;}
  });
  var groups={},alias={};
  rows.forEach(function(x){
    x.key=x.head?(x.mark||groupName(x.text)):(x.mark||x.group||'');
    x.inGroup=!x.head&&!x.mark&&!!x.group;
    if(x.head&&x.mark&&x.text)alias[groupName(x.text)]=x.mark;
    if(!x.head&&x.key)(groups[x.key]=groups[x.key]||[]).push(x);
  });
  /* 名前だけのまとまりは2文字以上のときだけ手順から探す */
  var words=Object.keys(groups).concat(Object.keys(alias)).filter(function(k){return /^[^ぁ-んァ-ヶ一-龠]$/.test(k)||k.length>=2;});
  return {rows:rows,groups:groups,alias:alias,re:markRe(words)};
}

/* ---------- 分量の計算 ---------- */
var RE_SERV=/(\d+(?:\.\d+)?)(?:\s*[〜～~\-－ー−]\s*(\d+(?:\.\d+)?))?\s*(人前|人分|人|名分|名|個分|個|枚分|枚|本分|本|台分|台|切れ分|切れ|皿分|皿|杯分|杯|食分|食|合分|合|つ分|つ|玉分|玉|斤分|斤|カップ分|カップ|ホール|袋分|袋|缶分)/;
var MULT=[.25,.5,1,1.5,2,3,4,5];
function normWide(s){
  return String(s).replace(/[０-９Ａ-Ｚａ-ｚ／．＋]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);})
    .replace(/(\d)\s*(?=[½¼¾⅓⅔⅛])/g,'$1と')
    .replace(/[½¼¾⅓⅔⅛]/g,function(v){return {'½':'1/2','¼':'1/4','¾':'3/4','⅓':'1/3','⅔':'2/3','⅛':'1/8'}[v];});
}
function servBase(r){
  var t=normWide(r.servings||'').replace(/[一二三四五六七八九十](?=人|名)/g,function(c){return '一二三四五六七八九十'.indexOf(c)+1;});
  var m=RE_SERV.exec(t);
  if(!m||!(+m[1]>0))return null;
  return {n:+m[1],hi:m[2]?+m[2]:0,unit:m[3].replace(/^(人|名|名分)$/,'人分')};
}
function servNow(r){var b=servBase(r);return state.serv[r.id]||(b?b.n:1);}
function servFactor(r){var b=servBase(r);return servNow(r)/(b?b.n:1);}
function servLabel(r){var b=servBase(r),v=servNow(r);return b?v+b.unit:frac(v)+'倍';}
function servStep(r,dir){
  var b=servBase(r),v=servNow(r);
  if(b){v=dir>0?Math.floor(v)+1:Math.ceil(v)-1;v=Math.min(Math.max(b.n*5,20),Math.max(1,v));}
  else{v=MULT[Math.min(MULT.length-1,Math.max(0,MULT.indexOf(v)+dir))];}
  state.serv[r.id]=v;
}
function frac(v){
  var w=Math.floor(v),r=v-w,C=[0,1/8,1/4,1/3,1/2,2/3,3/4,1],L=['','1/8','1/4','1/3','1/2','2/3','3/4',''],b=0;
  C.forEach(function(c,i){if(Math.abs(c-r)<Math.abs(C[b]-r))b=i;});
  if(b===7){w++;b=0;}
  if(!w&&!b)b=1;
  return w?w+(L[b]?'と'+L[b]:''):L[b];
}
/* 小さじに直した量を、計りやすい言い方にする */
function spoonText(x){
  var d=Math.floor((x+.01)/3),rem=x-d*3;
  if(rem<.05)return '大さじ'+d;
  if(Math.abs(rem-1.5)<.05)return d?'大さじ'+d+'と1/2':'大さじ1/2';
  return (d?'大さじ'+d+'と':'')+'小さじ'+frac(rem);
}
function fmtAmt(v,u){
  if(/^(g|グラム|mg|㎎|ml|mL|ML|㎖|cc|CC|㏄)$/.test(u))return String(v>=1000?Math.round(v/10)*10:v>=100?Math.round(v/5)*5:v>=10?Math.round(v):Math.round(v*10)/10);
  if(/^(kg|キログラム|キロ|㎏|L|ℓ|リットル)$/.test(u))return String(Math.round(v*100)/100);
  if(/^(cm|センチ)$/.test(u))return String(Math.max(.5,Math.round(v*2)/2));
  return frac(v);
}
function numVal(s){
  var m=/^(\d+)\s*分の\s*(\d+)$/.exec(s);
  if(m)return +m[2]/+m[1];
  m=/^(?:(\d+(?:\.\d+)?)\s*(?:と|・|\+|\s)\s*)?(\d+)\/(\d+)$/.exec(s);
  if(m)return (m[1]?+m[1]:0)+(+m[2]/+m[3]);
  return parseFloat(s);
}
var AMT_NUM='\\d+\\s*分の\\s*\\d+|\\d+/\\d+|\\d+(?:\\.\\d+)?(?:\\s*(?:と|・|\\+|\\s)\\s*\\d+/\\d+)?';
var AMT_MEASURE='kg|キログラム|キロ|㎏|mg|㎎|g|グラム|ml|mL|ML|㎖|cc|CC|㏄|L|ℓ|リットル|カップ|cup';
var AMT_COUNT='(?:cm|センチ)(?!厚|幅|角|長|四方|型|大|丸|高)|個|コ|本|枚|切れ|切|片|かけ|カケ|房|ふさ|袋|缶|束|把|株|玉|丁|尾|匹|杯|合|箱|粒|膳|パック|カット|節|腹|羽|枝|つまみ|つかみ|にぎり|握り|ふり|振り|滴|つ';
var RE_AMT=new RegExp(
  /* 計算しないもの：厚さ2cm、(1枚200g)のような1つあたりの重さ、8枚切り、10個入り */
  '(?:厚さ|幅|長さ|直径|太さ|高さ)\\s*約?\\s*[\\d.]+\\s*(?:cm|センチ|mm|ミリ)'+
  '|[(（]\\s*1(?:枚|切れ|個|本|尾|匹|丁|パック|袋|缶|玉|株|房)(?:あたり|当たり)?\\s*約?\\s*[\\d.]+\\s*(?:g|グラム|kg|ml|cc)?'+
  '|\\d+(?:枚|個|本|切れ)(?:入り|入|おろし|切り)'+
  '|((?:大さじ|小さじ|大匙|小匙|カップ|cup|大|小|中)\\s*(?:約\\s*)?)?('+AMT_NUM+')(?:\\s*[〜～~\\-－ー−、]\\s*('+AMT_NUM+'))?(\\s*(?:'+AMT_MEASURE+'|'+AMT_COUNT+')(?![A-Za-z]))?','g');
var RE_MEASURE=new RegExp('^(?:'+AMT_MEASURE+')$');
/* 計算した分量を印（〜）で囲んで返す。stepはtrueだと計量の単位だけ計算する（「2枚に切る」などを変えない） */
function scaleText(s,f,step){
  if(f===1)return s;
  s=normWide(s);
  if(!step){
    s=s.replace(/(ひと|ふた)(つまみ|つかみ|にぎり|握り|かけ|カケ|房|ふさ|束|株|玉|切れ|片|パック|袋|缶|つ)/g,function(m,a,u){return (a==='ひと'?1:2)+u;})
      .replace(/(一|二|三)(かけ|カケ|つまみ|つかみ|房|束|株|玉|切れ|片|パック|袋|缶)/g,function(m,a,u){return ('一二三'.indexOf(a)+1)+u;})
      .replace(/半(個|本|玉|丁|袋|束|株|枚|カップ|パック|缶|切れ)/g,'1/2$1')
      .replace(/半分$/,'1/2つ分');
  }
  return s.replace(RE_AMT,function(m,p,a,b,u,off,str){
    if(!a)return m;
    p=p||'';
    var unit=(u||'').trim(),spoon=/さじ|匙/.test(p),measure=spoon||/カップ|cup/.test(p)||RE_MEASURE.test(unit);
    /* 「卵 2」のように行末の数字だけのときも量とみなす */
    var bareEnd=!p&&!unit&&off>0&&off+m.length===str.length&&/\s/.test(str.charAt(off-1));
    if(step?!measure:!(p||unit||bareEnd))return m;
    var v=numVal(a)*f,w=b?numVal(b)*f:0;
    if(!isFinite(v)||!isFinite(w))return m;
    if(spoon&&!b&&!unit)return ''+(/約/.test(p)?'約':'')+spoonText(v*(/大/.test(p)?3:1))+'';
    return ''+p+fmtAmt(v,unit)+(b?'〜'+fmtAmt(w,unit):'')+unit+'';
  });
}
/* 印を付けた文字を画面用のHTMLにする */
function rich(t){
  return esc(t).replace(//g,'<b class="amt">').replace(//g,'</b>').replace(//g,'<span class="mk">').replace(//g,'</span>');
}
/* 手順1つ分：本文の目印に色を付け、その目印の材料を下に添える */
function stepHtml(r,info,text){
  var f=servFactor(r),keys=[],t=scaleText(text,f,true);
  if(info.re)t=t.replace(info.re,function(all,pre,w){
    var k=markKey(w);k=info.alias[k]||k;
    if(keys.indexOf(k)<0)keys.push(k);
    return pre+''+markKey(w)+'';
  });
  var refs=keys.filter(function(k){return info.groups[k];}).map(function(k){
    return '<div class="ref'+(k.length>2?' named':'')+'"><span class="mk">'+esc(k)+'</span><div class="ref-list">'+
      info.groups[k].map(function(x){return rich(scaleText(x.text,f));}).join('<br>')+'</div></div>';
  }).join('');
  return {text:rich(t),refs:refs?'<div class="refs">'+refs+'</div>':''};
}
var checks={};/* 材料のチェック（開いている間だけ） */
function ingList(r,info){
  var c=checks[r.id]||{},f=servFactor(r);
  return '<ul class="ing">'+info.rows.map(function(x){
    if(x.head)return '<li class="ing-group">'+(x.mark?'<span class="mk">'+esc(x.mark)+'</span>':'')+'<span>'+esc(x.text)+'</span></li>';
    return '<li'+(x.inGroup?' class="in-group"':'')+'><label><input type="checkbox" data-ing="'+x.i+'"'+(c[x.i]?' checked':'')+'><span>'+
      (x.mark?'<span class="mk">'+esc(x.mark)+'</span>':'')+rich(scaleText(x.text,f))+'</span></label></li>';
  }).join('')+'</ul>';
}
function servHtml(r){
  var b=servBase(r),v=servNow(r),atMin=b?v<=1:v===MULT[0],id=esc(r.id);
  return '<div class="serv" role="group" aria-label="分量を変える">'+
    '<button data-act="servdown" data-id="'+id+'" aria-label="減らす"'+(atMin?' disabled':'')+'>−</button>'+
    '<b aria-live="polite">'+esc(servLabel(r))+'</b>'+
    '<button data-act="servup" data-id="'+id+'" aria-label="増やす">＋</button></div>';
}
function servNote(r){
  if(servFactor(r)===1)return '';
  var b=servBase(r);
  var from=!b?'元のレシピの量を1倍として計算しています。':(b.hi?'元のレシピは'+b.n+'〜'+b.hi+b.unit+'（'+b.n+b.unit+'として計算）。':'元のレシピは'+b.n+b.unit+'。');
  return '<div class="serv-note"><span>'+esc(from)+'色の付いた文字が計算した分量です。少々・適量や加熱時間はそのままなので、味や火の通りを見て調整してください。</span>'+
    '<button class="chip" data-act="servreset" data-id="'+esc(r.id)+'">元に戻す</button></div>';
}

function viewRecipe(r){

    '<div class="row"><button class="btn" data-act="import">ファイルから読み込む</button></div>'+
    '<input id="imp" type="file" accept=".json,application/json" hidden>'+
    '<p class="meta">読み込みは今のレシピに足されます。同じレシピは新しい内容で上書きされます。</p>'+
    '<h2 class="sec">レシピの取り込み</h2><p><a href="shortcut.html">iPhoneで抜き出せるようにする設定</a></p></div>';
  $('#imp').addEventListener('change',function(e){
    var f=e.target.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var data=JSON.parse(rd.result),arr=Array.isArray(data)?data:data.recipes,list=load(),added=0;
        if(!Array.isArray(arr))throw 0;
        arr.forEach(function(x){
          if(!x||!x.title)return;
          x.id=x.id||newId();x.ingredients=x.ingredients||[];x.steps=x.steps||[];
          var i=list.findIndex(function(y){return y.id===x.id;});
          if(i>=0)list[i]=x;else list.push(x);
          added++;
        });
        save();toast(added+'件読み込みました');viewData();
      }catch(err){toast('このファイルは読み込めませんでした');}
    };
    rd.readAsText(f);
  });
}
function exportData(){
  var d=new Date(),name='recipes_'+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'.json';
  var blob=new Blob([JSON.stringify({version:1,recipes:load()},null,1)],{type:'application/json'});
  var file=null;try{file=new File([blob],name,{type:'application/json'});}catch(e){}
  /* スマホは共有メニューの方が保存先を選びやすい */
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:name}).catch(function(){});
    return;
  }
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}

/* ---------- 操作 ---------- */
document.addEventListener('click',function(e){
  var chip=e.target.closest('[data-cat]');
  if(chip){state.cat=chip.getAttribute('data-cat');paintList();return;}
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act'),id=b.getAttribute('data-id');
  switch(a){
    case 'home':go('#/');break;
    case 'back':history.back();break;
    case 'new':state.delArmed=false;go('#/new');break;
    case 'data':go('#/data');break;
    case 'edit':state.delArmed=false;go('#/edit/'+id);break;
    case 'cook':state.step=0;state.sheet=false;go('#/r/'+id+'/cook');break;
    case 'cookclose':go('#/r/'+id);break;
    case 'prev':if(state.step>0){state.step--;state.sheet=false;render();}break;
    case 'next':{
      var r=getRecipe(id),n=realSteps(r).length;
      if(state.step<n-1){state.step++;state.sheet=false;render();}
      else{r.lastCooked=Date.now();save();delete checks[id];toast('おつかれさまでした');go('#/r/'+id);}
      break;
    }
    case 'sheet':state.sheet=!state.sheet;render();break;
    case 'servup':case 'servdown':case 'servreset':{
      /* render() は画面の先頭に戻るので、ここでは描き直しだけにする */
      var sr=getRecipe(id);
      if(a==='servreset')delete state.serv[id];else servStep(sr,a==='servup'?1:-1);
      viewRecipe(sr);paintWake();
      var fb=$('[data-act="'+a+'"]');if(fb)fb.focus();
      break;
    }
    case 'bigger':case 'smaller':{
      var sc=Math.min(1.6,Math.max(.7,(prefs().scale||1)+(a==='bigger'?.15:-.15)));
      setPref('scale',sc);$('#cook').style.setProperty('--scale',sc);break;
    }
    case 'wake':
      if(!Wake.supported())break;
      if(Wake.want){setPref('wake',false);Wake.stop();toast('画面ONを切りました');}
      else{setPref('wake',true);Wake.start();}
      break;
    case 'paste':
      if(navigator.clipboard&&navigator.clipboard.readText){
        navigator.clipboard.readText().then(function(t){
          if(t&&t.trim()){$('#paste').value=t;applyPaste(t);}else toast('コピーされた文字がありません');
        }).catch(function(){toast('読み込めませんでした。貼り付け欄を長押しして貼り付けてください');$('#paste').focus();});
      }else{toast('貼り付け欄を長押しして貼り付けてください');$('#paste').focus();}
      break;
    case 'save':saveForm(id);break;
    case 'del':
      if(!state.delArmed){state.delArmed=true;b.textContent='もう一度押すと削除します';break;}
      state.delArmed=false;
      mem=load().filter(function(r){return r.id!==id;});save();toast('削除しました');location.replace('#/');
      break;
    case 'export':exportData();break;
    case 'import':$('#imp').click();break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.matches&&t.matches('[data-ing]')){
    var m=/^\/r\/([^/]+)/.exec(location.hash.replace(/^#/,''));
    if(m){(checks[m[1]]=checks[m[1]]||{})[t.getAttribute('data-ing')]=t.checked;}
  }
});
window.addEventListener('hashchange',render);
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
